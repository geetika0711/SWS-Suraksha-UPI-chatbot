<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SWS Suraksha Bot</title>

  <!-- Bootstrap 5 (makes the page work on every phone and computer) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Fonts that can show English, Hindi and Punjabi letters -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Baloo+Paaji+2:wght@600;800&family=Mukta:wght@400;600&family=Noto+Sans+Gurmukhi:wght@400;600&display=swap">
  <!-- Our own design -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app d-flex flex-column position-relative">

  <!-- ===== TOP BAR: logo, name, language buttons ===== -->
  <header class="topbar d-flex align-items-center gap-2 px-3 py-2">
    <!-- Our bot logo: a shield with a rupee sign -->
    <svg class="bot-logo" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M32 3 L57 12 V30 C57 45 46 56 32 61 C18 56 7 45 7 30 V12 Z" fill="#F4C430"/>
      <path d="M32 9 L51 16 V30 C51 42 43 51 32 55 C21 51 13 42 13 30 V16 Z" fill="#12305C"/>
      <text x="32" y="42" text-anchor="middle" font-size="26" font-weight="800" fill="#F4C430" font-family="Arial, sans-serif">₹</text>
    </svg>

    <div class="flex-grow-1 lh-sm">
      <h1 class="app-name m-0">SWS Suraksha Bot</h1>
      <small class="app-sub" data-t="subtitle">Your UPI safety coach</small>
    </div>

    <!-- SCHOOL LOGO: put your logo file next to index.html and name it school-logo.png -->
    <img src="school-logo.png" alt="School logo" class="school-logo" onerror="this.style.display='none'">
  </header>

  <!-- Language buttons (left) + History and Clear buttons (right) -->
  <nav class="langbar d-flex flex-wrap justify-content-between align-items-center gap-2 px-3 py-2">
    <div class="d-flex gap-1" aria-label="Language">
      <button class="btn btn-sm lang-btn active" data-lang="en">English</button>
      <button class="btn btn-sm lang-btn" data-lang="hi">हिंदी</button>
      <button class="btn btn-sm lang-btn" data-lang="pa">ਪੰਜਾਬੀ</button>
    </div>
    <div class="d-flex gap-1">
      <button class="btn btn-sm tool-btn" id="historyBtn" data-t="history">🕘 History</button>
      <button class="btn btn-sm tool-btn" id="clearBtn" data-t="clear">🧹 Clear chat</button>
    </div>
  </nav>

  <!-- Safety warning that always stays on screen -->
  <div class="warning px-3 py-2" role="note">
    ⚠️ <span data-t="warning">Never type your real PIN or OTP here.</span>
  </div>

  <!-- ===== HISTORY PANEL (hidden until History is tapped) ===== -->
  <section id="historyPanel" class="history-panel px-3 py-3" hidden>
    <div class="d-flex align-items-center mb-1">
      <h2 class="history-title flex-grow-1 m-0" data-t="historyTitle">Your past questions</h2>
      <button class="btn btn-sm tool-btn" id="closeHistory" data-t="close">Close</button>
    </div>
    <small class="d-block mb-3 text-body-secondary" data-t="historyNote">Saved only on this phone.</small>
    <div id="historyList" class="list-group"></div>

    <!-- Delete all history (asks "are you sure?" first) -->
    <button class="btn btn-sm btn-outline-danger mt-4" id="deleteAllBtn" data-t="deleteAll">🗑️ Delete all history</button>
    <div id="confirmBox" class="confirm-box d-flex flex-wrap align-items-center gap-2 px-3 py-2 mt-2 rounded" hidden>
      <span class="flex-grow-1" data-t="confirmClear">Delete all your chat history from this phone?</span>
      <button class="btn btn-sm btn-danger" id="yesClear" data-t="yesDelete">Yes, delete</button>
      <button class="btn btn-sm btn-light" id="noClear" data-t="cancel">Cancel</button>
    </div>
  </section>

  <!-- ===== CHAT MESSAGES appear here ===== -->
  <main id="chat" class="chat flex-grow-1 px-3 py-3" aria-live="polite"></main>

  <!-- ===== QUICK BUTTONS for common situations ===== -->
  <div class="chips-wrap px-3 pt-2">
    <small class="chips-label" data-t="chipsLabel">Common situations</small>
    <div id="chips" class="chips d-flex gap-2 py-2"></div>
  </div>

  <!-- ===== TYPING BAR ===== -->
  <div class="inputbar px-2 py-2">
    <div class="input-group">
      <!-- Attach button (hidden file picker) -->
      <button class="btn icon-btn" id="attachBtn" title="Attach a picture">📎</button>
      <input type="file" id="fileInput" accept="image/*,.txt" hidden>

      <!-- Microphone button -->
      <button class="btn icon-btn" id="micBtn" title="Speak">🎤</button>

      <input type="text" id="userInput" class="form-control" placeholder="Describe what happened…" autocomplete="off">
      <button class="btn send-btn" id="sendBtn" title="Send">➤</button>
    </div>
  </div>
</div>

<!-- Small pop-up message (shows for 3 seconds) -->
<div id="popup" class="popup" role="status" aria-live="polite" hidden></div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
